
name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          ACCESS_KEY: "ci-placeholder-access-key-000000000000"
          SESSION_SECRET: "ci-placeholder-session-secret-000000000000"
          ENCRYPTION_KEY: "ci-placeholder-encryption-key"
          ANTHROPIC_API_KEY: "ci-placeholder-anthropic-key"
          CRON_SECRET: "ci-placeholder-cron-secret-000000000000"
